[project]
name = "triage-agent"
version = "0.1.0"
description = "Support triage agent with MCP tooling and an eval harness"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # web / api
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # config / validation
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # data layer
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",
    # queue
    "redis>=5.0",
    "arq>=0.26",
    # http / llm / mcp
    "httpx>=0.27",
    "anthropic>=0.39",
    "mcp>=1.2",
    "tenacity>=9.0",
    # observability
    "structlog>=24.4",
    # cli / eval
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "locust>=2.32",
]

[project.scripts]
triage-eval = "evals.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "apps", "mcp_servers", "evals"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
