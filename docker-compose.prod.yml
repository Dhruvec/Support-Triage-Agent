# ---------------------------------------------------------------------------
# Production stack for a single EC2 host (the cheapest viable topology).
#
# Postgres and Redis are MANAGED AWS services (RDS + ElastiCache); there are
# deliberately NO `postgres` / `redis` services here. Every connection string,
# secret and token is supplied via `.env` (see `.env.production.example`).
#
# Security posture:
#   * `api` publishes NO host ports - it is reachable only on the private
#     compose network.
#   * `nginx` is the only public surface (port 80). It forwards the read/ingest
#     routes and hard-blocks the unauthenticated internal endpoints that exist
#     in apps/api/main.py (`POST /internal/worker`, `POST /tickets/{id}/approve`).
#
# Usage on the host (infra/aws/user-data.sh automates this on first boot):
#   docker compose -f docker-compose.prod.yml --env-file .env pull
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
# ---------------------------------------------------------------------------
services:
  api:
    image: ${TRIAGE_IMAGE:?TRIAGE_IMAGE (ECR image URI) must be set}
    env_file: .env
    environment:
      # Worker -> API target. Kept in sync with apps/worker/main.py (_API_BASE).
      TRIAGE_API_URL: http://api:8000
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: ${TRIAGE_IMAGE:?TRIAGE_IMAGE (ECR image URI) must be set}
    command: arq apps.worker.main.WorkerSettings
    env_file: .env
    environment:
      TRIAGE_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
