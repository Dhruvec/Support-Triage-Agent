# Minimal reverse proxy for the triage API on a single EC2 host.
#
# apps/api/main.py exposes two UNAUTHENTICATED endpoints that must never be
# reachable from the internet:
#   * POST /internal/worker        - accepts arbitrary payloads and runs the agent
#   * POST /tickets/{id}/approve   - executes gated write tools
#
# This proxy publishes only the read/ingest surface and returns 404 for
# everything else. The API container itself publishes no host ports, so the
# worker still reaches /internal/worker over the private compose network.

upstream triage_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # CSV ingest uploads (POST /ingest/csv).
    client_max_body_size 10m;

    # --- Public surface ------------------------------------------------------
    location = /health { proxy_pass http://triage_api; }
    location = /ingest { proxy_pass http://triage_api; }
    location /ingest/  { proxy_pass http://triage_api; }
    location /pending   { proxy_pass http://triage_api; }

    # Tickets: read-only. `limit_except GET` denies HEAD/OPTIONS too, which
    # blocks POST /tickets/{id}/approve (defense in depth with the rule below).
    location /tickets {
        limit_except GET { deny all; }
        proxy_pass http://triage_api;
    }

    # --- Explicitly blocked internal endpoints -------------------------------
    location ~ ^/tickets/[^/]+/approve$ { return 404; }
    location /internal/ { return 404; }

    # --- Everything else ------------------------------------------------------
    location / { return 404; }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
